x-google-marketplace:
  schemaVersion: v2

  applicationApiVersion: v1beta1
  # The published version is required and MUST match the tag
  # of the deployer image
  publishedVersion: '1.8.6'
  publishedVersionMetadata:
    releaseNote: >-
      Odigos is a platform for tracing and observability.

  deployerServiceAccount:
    description: >
        Creates app resources, including the Odigos CRDs and RBAC resources.
    roles:
      - type: ClusterRole
        rulesType: CUSTOM
        rules:
        # CRD management
        - apiGroups: ['apiextensions.k8s.io']
          resources: ['customresourcedefinitions']
          verbs: ['*']
        # Odigos CRDs
        - apiGroups: ['odigos.io']
          resources: ['*']
          verbs: ['*']
        - apiGroups: ['actions.odigos.io']
          resources: ['*']
          verbs: ['*']
        - apiGroups: ['operator.odigos.io']
          resources: ['*']
          verbs: ['*']
        # Core resources
        - apiGroups: ['']
          resources: ['configmaps', 'secrets', 'services', 'serviceaccounts', 'pods', 'namespaces', 'resourcequotas', 'nodes', 'endpoints']
          verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
        # Core subresources
        - apiGroups: ['']
          resources: ['nodes/proxy', 'nodes/stats', 'pods/status']
          verbs: ['get', 'list']
        # Apps resources
        - apiGroups: ['apps']
          resources: ['deployments', 'daemonsets', 'statefulsets', 'replicasets']
          verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
        # Batch resources
        - apiGroups: ['batch']
          resources: ['jobs', 'cronjobs']
          verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
        # RBAC resources
        - apiGroups: ['rbac.authorization.k8s.io']
          resources: ['roles', 'rolebindings', 'clusterroles', 'clusterrolebindings']
          verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
        # Policy resources
        - apiGroups: ['policy']
          resources: ['poddisruptionbudgets']
          verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
        # Webhook configurations
        - apiGroups: ['admissionregistration.k8s.io']
          resources: ['mutatingwebhookconfigurations', 'validatingwebhookconfigurations']
          verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  
  images:
    '':
      properties:
        imageFull:
          type: FULL
    odigos-init-container:
      properties:
        initContainerImageFull:
          type: FULL
    odigos-scheduler:
      properties:
        schedulerImageFull:
          type: FULL
    odigos-instrumentor:
      properties:
        instrumentorImageFull:
          type: FULL
    odigos-odiglet:
      properties:
        odigletImageFull:
          type: FULL
    odigos-ui:
      properties:
        uiImageFull:
          type: FULL
    odigos-autoscaler:
      properties:
        autoscalerImageFull:
          type: FULL
    odigos-collector:
      properties:
        collectorImageFull:
          type: FULL

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

required:
- name
- namespace
